<article class="blog-category-card">
  <header class="blog-category-card__header">
    <span class="blog-category-card__slug">{{ category().slug }}</span>
    <div class="blog-category-card__actions">
      <i class="pi pi-folder blog-category-card__icon" aria-hidden="true"></i>
      <p-button
        icon="pi pi-pencil"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        size="small"
        [ariaLabel]="'Edit category ' + category().title"
        (onClick)="editRequested.emit(category())"
      />
    </div>
  </header>
  <h2 class="blog-category-card__title">{{ category().title }}</h2>
  <p class="blog-category-card__description">{{ category().description }}</p>
  <footer class="blog-category-card__footer">
    <div class="blog-category-card__date">
      <i class="pi pi-calendar" aria-hidden="true"></i>
      <span>Created {{ category().createdAt | date: 'MMM d, y' }}</span>
    </div>
    <div class="blog-category-card__date">
      <i class="pi pi-clock" aria-hidden="true"></i>
      <span>Modified {{ category().lastModifiedAt | date: 'MMM d, y' }}</span>
    </div>
  </footer>
</article>
